  header {
    background:linear-gradient(135deg,#0a2e22,#0e1613); padding:22px 16px;

  }
  .tag { font-size:11px; letter-spacing:1px; color:#7fd9ad; text-transform:uppercase; }
  header h1 { margin:6px 0 8px; font-size:26px; color:#e9c46a; }

  nav.tabs {
    display:flex; background:#0a1f17; border-bottom:1px solid #1e4d38; position:sticky; top:0; z-index:20;
  }
  nav.tabs button {
    flex:1; padding:13px; background:none; border:none; color:#8fa89c; font-size:14px; font-weight:bold; cursor:pointer;
    border-bottom:3px solid transparent;
  }
  nav.tabs button.active { color:#e9c46a; border-bottom-color:#e9c46a; }

  main { padding:14px; max-width:1100px; margin:0 auto; }
  .hidden { display:none !important; }

  /* filters */
  .filters {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:8px; margin-bottom:14px;
  }
  .filters input, .filters select {
    width:100%; padding:9px 10px; background:#132a20; border:1px solid #2a4d3c; color:#eef2ef;
    border-radius:8px; font-size:13px;
  }
  .scope-label {
    grid-column: span 2;
    white-space: normal !important;
  }
  @media (max-width: 480px) {
    .scope-label { grid-column: 1 / -1; }
  }
  .result-count { font-size:12px; color:#8fa89c; margin-bottom:10px; }

  /* player cards */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px; }
  .card {
    background:#132a20; border:1px solid #234238; border-radius:10px; padding:10px; cursor:pointer;
    transition:border-color .15s;
  }
  .card:hover { border-color:#e9c46a; }
  .card .name { font-weight:bold; font-size:14px; margin-bottom:4px; }
  .card .meta { font-size:11px; color:#8fa89c; line-height:1.5; }
  .pos-chip {
    display:inline-block; font-size:10px; background:#1e4d38; color:#a9e6c4; padding:2px 6px;
    border-radius:6px; margin:2px 2px 0 0;
  }
  .status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-left:4px; }
  .status-active { background:#2ecc71; }
  .status-academy { background:#4aa3ff; }
  .status-retired { background:#888; }
  .status-free_agent { background:#e9c46a; }

  /* modal */
  #modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; z-index:100;
    align-items:flex-start; justify-content:center; overflow-y:auto; padding:20px 10px;
  }
  #modal {
    background:#132a20; border:1px solid #2a6b4b; border-radius:14px; max-width:560px; width:100%;
    padding:20px; margin-top:20px;
  }
  #modal h2 { color:#e9c46a; margin:0 0 4px; font-size:20px; }
  #modal .closeBtn { float:left; background:none; border:none; color:#8fa89c; font-size:22px; cursor:pointer; }
  .field { margin:10px 0; }
  .field .label { font-size:11px; color:#7fd9ad; margin-bottom:2px; }
  .field .value { font-size:13px; line-height:1.6; }
  .unverified { color:#e08a4a; font-size:11px; margin-right:6px; }
  .sources a { color:#6fb8e6; font-size:12px; display:block; margin:3px 0; word-break:break-all; }
  .potential-box {
    margin-top:14px; padding:10px; background:#0a1f17; border:1px dashed #e9c46a; border-radius:8px;
  }
  .potential-box .label { color:#e9c46a; }
  .potential-stars { font-size:18px; }

  .formations button {
    padding:8px 14px; border-radius:8px; border:1px solid #2a4d3c; background:#132a20; color:#eef2ef;
    cursor:pointer; font-size:13px;
  }
  .formations button.active { background:#e9c46a; color:#0e1613; border-color:#e9c46a; font-weight:bold; }
  #pitch {
    position:relative; width:100%; aspect-ratio:2/3; max-width:420px; margin:0 auto 14px;
    background:repeating-linear-gradient(0deg,#1c5c3f 0 30px,#1f6b47 30px 60px);
    border:3px solid #2a6b4b; border-radius:10px; overflow:hidden;
  }
  .slot {
    position:absolute; width:70px; transform:translate(-50%,-50%); text-align:center; cursor:pointer;
  }
  .slot .chip {
    background:#0a1f17dd; border:2px solid #2a6b4b; border-radius:8px; padding:4px 3px; font-size:10px;
  }
  .slot.filled .chip { border-color:#e9c46a; background:#0a1f17; }
  .slot.active .chip { border-color:#fff; box-shadow:0 0 8px #fff; }
  .slot .posLabel { font-size:9px; color:#7fd9ad; }
  .slot .pname { font-size:11px; font-weight:bold; color:#eef2ef; }
  .slot .clearX {
    position:absolute; top:-8px; left:-8px; background:#c0392b; color:#fff; border-radius:50%;
    width:16px; height:16px; font-size:10px; line-height:16px; display:none;
  }
  .slot.filled:hover .clearX { display:block; }

  .squad-actions { display:flex; gap:8px; margin:10px 0; flex-wrap:wrap; }
  .squad-actions button {
    padding:9px 14px; border-radius:8px; border:1px solid #2a4d3c; background:#132a20; color:#eef2ef; cursor:pointer; font-size:13px;
  }
  .squad-actions button.primary { background:#e9c46a; color:#0e1613; border-color:#e9c46a; font-weight:bold; }

  /* match simulator */
  .match-teams { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; }
  .match-team-box {
    flex:1; min-width:220px; background:#0a1f17; border:1px solid #234238; border-radius:10px; padding:12px;
  }
  .match-team-title { color:#e9c46a; font-weight:bold; margin-bottom:8px; font-size:14px; }
  .match-team-list { font-size:12px; color:#cfe6da; line-height:1.7; }
  .match-team-list .empty-hint { color:#8fa89c; font-style:italic; }
  .match-vs { align-self:center; font-weight:bold; color:#8fa89c; font-size:16px; padding:0 4px; }
  #match-result { margin-top:14px; }
  .match-score {
    text-align:center; font-size:32px; font-weight:bold; color:#eef2ef; margin:10px 0;
  }
  .match-score .team-name { font-size:14px; color:#8fa89c; display:block; font-weight:normal; }
  .match-ratings { display:flex; justify-content:center; gap:24px; font-size:12px; color:#8fa89c; margin-bottom:10px; }
  .match-events { background:#0a1f17; border:1px solid #234238; border-radius:10px; padding:10px; margin-top:10px; }
  .match-events .event-row { font-size:13px; color:#cfe6da; padding:4px 0; border-bottom:1px solid #16261f; }

  .match-events .event-minute { color:#e9c46a; font-weight:bold; display:inline-block; width:36px; }

// ---------- session potential engine ----------
// weighted random draw used only to fill players whose potential was left empty;
// potential 10 never appears here, 9 is very rare, 8 is rare, the rest scale down
// from a peak around 4-5 as the value rises.
function randomPotential() {
  const table = [[1,5.5],[2,10],[3,18],[4,20],[5,20],[6,15],[7,9],[8,2],[9,0.5]];
  const total = table.reduce((s,e)=>s+e[1], 0);
  let r = Math.random() * total;
  for (const [v,w] of table) { r -= w; if (r <= 0) return v; }
  return table[table.length-1][0];
}

// current, evolving potential for this browser session only (never persisted).
// starts from the stored value, or a random draw (see above) if it was left empty.
const CURRENT_POTENTIAL = {};
PLAYERS.forEach(p => {
  CURRENT_POTENTIAL[p.id] = (p.potential != null) ? p.potential : randomPotential();
});

// full history of potential changes per player, for the developers view only —
// never shown to a regular user. index 0 is always the starting value.
const POTENTIAL_HISTORY = {};
PLAYERS.forEach(p => { POTENTIAL_HISTORY[p.id] = [{ match: 0, value: CURRENT_POTENTIAL[p.id] }]; });
let globalMatchIndex = 0;

function basePotential(p) { return (p && CURRENT_POTENTIAL[p.id] != null) ? CURRENT_POTENTIAL[p.id] : 4; }

// academy players who have not yet been promoted to the senior squad carry a
// potential discount vs. players who already made it — the younger they are
// the smaller this discount (a 16-year-old barely loses anything, a
// 22-year-old still in the academy loses noticeably more).
function notYetPromotedDiscount(p) {
  if (!p || p.careerStatus !== 'academy') return 0;
  const age = p.age || 16;
  return Math.max(0, Math.min(1.5, (age - 15) * 0.2));
}

// players over 31 tend to decline in ability, and so in potential — except Messi.
function veteranDeclinePenalty(p) {
  if (!p || p.id === 'messi') return 0;
  const age = p.age || 20;
  if (age <= 31) return 0;
  return Math.min(3, (age - 31) * 0.3);
}

// the value actually used everywhere in the match engine: current potential,
// after the academy discount and veteran decline are applied.
function effectivePotential(p) {
  if (!p) return 4;
  const v = basePotential(p) - notYetPromotedDiscount(p) - veteranDeclinePenalty(p);
  return Math.max(1, Math.min(10, v));
}

function t(key, ...args) {
  const entry = I18N[currentLang][key];
  if (typeof entry === 'function') return entry(...args);
  return entry != null ? entry : key;
}

function displayName(p) {
  if (!p) return '';
  return (currentLang === 'en' && p.nameEn) ? p.nameEn : p.nameHe;
}

function applyStaticI18n() {
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'he' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = t(key);
    if (typeof val === 'string') el.textContent = val;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const key = el.getAttribute('data-i18n-ph');
    const val = t(key);
    if (typeof val === 'string') el.placeholder = val;
  });
  document.getElementById('lang-toggle').textContent = currentLang === 'he' ? 'EN' : 'עברית';
  document.title = t('appTitle');
}

document.getElementById('lang-toggle').addEventListener('click', () => {
  currentLang = currentLang === 'he' ? 'en' : 'he';
  applyStaticI18n();
  renderPlayersGrid();

  renderSavedTeamsList();

function populateLeagueFilter() {

// A player belongs to exactly one scope bucket: La Masia active, La Masia retired,
// or first team (signings from outside La Masia). This lets any combination of the
// three scope checkboxes be selected (only La Masia, only first team, both, only
// retired, none at all, etc.) instead of the old "always show La Masia + add extras" logic.
function passesScopeFilter(p, scopeActive, scopeRetired, scopeFirstTeam) {
  if (p.group === 'firstTeam') return scopeFirstTeam;
  if (p.careerStatus === 'retired') return scopeRetired;
  return scopeActive;
}

function getFilteredPlayers() {
  const q = document.getElementById('f-search').value.trim().toLowerCase();
  const group = document.getElementById('f-group').value;
  const pos = document.getElementById('f-position').value;
  const status = document.getElementById('f-status').value;
  const league = document.getElementById('f-league').value;
  const scopeActive = document.getElementById('f-scope-active').checked;
  const scopeRetired = document.getElementById('f-scope-retired').checked;
  const scopeFirstTeam = document.getElementById('f-scope-firstteam').checked;
  // an explicit status (e.g. "retired") or an explicit first-team group
  // selection is a direct request to see that category — it should always
  // win over the broader default scope checkboxes, not be blocked by them.
  const scopeBypassed = !!status || group === 'firstTeam';
  return PLAYERS.filter(p => {
    if (!scopeBypassed && !passesScopeFilter(p, scopeActive, scopeRetired, scopeFirstTeam)) return false;
    if (q && !(p.nameHe.toLowerCase().includes(q) || (p.nameEn && p.nameEn.toLowerCase().includes(q)) || (p.currentClub||'').toLowerCase().includes(q))) return false;
    if (group && p.group !== group) return false;
    if (pos && !p.positions.includes(pos)) return false;
    if (status && p.careerStatus !== status) return false;
    if (league && p.league !== league) return false;
    return true;
  });
}

function renderPlayersGrid() {
  const list = getFilteredPlayers();
  document.getElementById('result-count').textContent = t('resultCount', list.length, PLAYERS.length);

      <div>${p.positions.map(c=>`<span class="pos-chip">${POS_LABEL(c)}</span>`).join('')}</div>
    `;
    grid.appendChild(card);
  });
}

// simulated recent-match stats (goals/assists/rating/pass accuracy/shots/tackles),
// generated by this app's own fictional match engine — not a claim about the
// real player, same as the rest of the simulated gameplay in this app.
function renderRecentMatchesTable(p) {
  const log = MATCH_LOG[p.id];
  if (!log || !log.length) return '';
  const rows = log.slice().reverse().map(m => `
    <div class="event-row" style="display:flex;gap:10px;flex-wrap:wrap;">
      <span style="color:#8fa89c;">${t('vsLabel')} ${m.opponent}</span>
      <span style="color:${m.rating>=7?'#7fd9ad':m.rating>=5?'#e9c46a':'#e07a5f'};font-weight:bold;">${m.rating.toFixed(1)}</span>
      <span>⚽ ${m.goals}</span>
      <span>🅰️ ${m.assists}</span>
      <span>${t('passAccLabel')} ${m.passAcc}%</span>
      <span>${t('shotsLabel')} ${m.shots}</span>
      <span>${t('tacklesLabel')} ${m.tackles}</span>
    </div>`).join('');
  return `<div class="field"><div class="label">${t('recentMatchesLabel')}</div><div class="match-team-list">${rows}</div></div>`;
}

// developers-only widget: lets a developer view/edit a player's raw potential
// and see it plotted against the effective (in-match) value. Never rendered
// in any screen a regular user can reach.
function renderPotentialStars(p, elId) {
  const el = document.getElementById(elId || 'potential-stars');
  el.innerHTML = '';
  const cur = CURRENT_POTENTIAL[p.id];
  for (let i=1;i<=10;i++) {
    const btn = document.createElement('span');
    btn.textContent = i;
    const active = cur && i<=cur;
    btn.style.cursor = 'pointer';
    btn.style.display = 'inline-flex';
    btn.style.alignItems = 'center';
    btn.style.justifyContent = 'center';
    btn.style.width = '22px';
    btn.style.height = '22px';
    btn.style.margin = '2px';
    btn.style.borderRadius = '4px';
    btn.style.fontSize = '12px';
    btn.style.fontWeight = 'bold';
    btn.style.background = active ? '#e9c46a' : '#243530';
    btn.style.color = active ? '#1a2a24' : '#8fa89c';
    btn.onclick = () => { CURRENT_POTENTIAL[p.id] = i; renderPotentialStars(p, elId); };
    el.appendChild(btn);
  }
  const valueLabel = document.createElement('span');
  valueLabel.textContent = cur ? (' ' + cur + '/10 ') : t('noScore');
  valueLabel.style.fontSize = '12px'; valueLabel.style.color = '#e9c46a'; valueLabel.style.margin = '0 8px';
  el.appendChild(valueLabel);
  const eff = effectivePotential(p);
  if (cur && Math.abs(eff - cur) > 0.01) {
    const effLabel = document.createElement('span');
    effLabel.textContent = t('effectiveLabel', eff.toFixed(2));
    effLabel.style.fontSize = '11px'; effLabel.style.color = '#8fa89c';
    el.appendChild(effLabel);
  }
  const clear = document.createElement('span');
  clear.textContent = t('clearLabel');
  clear.style.fontSize = '11px'; clear.style.color = '#8fa89c'; clear.style.cursor = 'pointer';
  clear.onclick = () => { CURRENT_POTENTIAL[p.id] = null; renderPotentialStars(p, elId); };
  el.appendChild(clear);
}

function renderPitch() {
  const pitch = document.getElementById('pitch');
  pitch.innerHTML = '';
  const slots = FORMATIONS[currentFormationKey];
  slots.forEach(slot => {
    const filledId = squad[slot.id];
    const div = document.createElement('div');
    div.className = 'slot' + (filledId ? ' filled' : '') + (activeSlotId===slot.id ? ' active' : '');
    div.style.left = slot.x + '%';
    div.style.top = slot.y + '%';
    const player = filledId ? playerById(filledId) : null;
    div.innerHTML = `
      <span class="clearX">✕</span>
      <div class="chip">
        <div class="posLabel">${POS_LABEL(slot.pos)}</div>
        <div class="pname">${player ? shortName(displayName(player)) : '+'}</div>
      </div>
    `;
    div.querySelector('.clearX').onclick = (e) => { e.stopPropagation(); delete squad[slot.id]; renderPitch(); };
    div.onclick = () => openPicker(slot);
    pitch.appendChild(div);
  });
}

function openPicker(slot) {
  activeSlotId = slot.id;
  renderPitch();
  document.getElementById('picker-panel').classList.remove('hidden');
  document.getElementById('picker-header').textContent = t('pickerHeaderFor', POS_LABEL(slot.pos));
  document.getElementById('picker-show-all').checked = false;
  document.getElementById('picker-search').value = '';
  renderPickerList(slot);
  document.getElementById('picker-panel').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function squadScopeFilter() {
  const scopeActive = document.getElementById('s-scope-active').checked;
  const scopeRetired = document.getElementById('s-scope-retired').checked;
  const scopeFirstTeam = document.getElementById('s-scope-firstteam').checked;
  return p => passesScopeFilter(p, scopeActive, scopeRetired, scopeFirstTeam);
}

function renderPickerList(slot) {
  const showAll = document.getElementById('picker-show-all').checked;
  const q = document.getElementById('picker-search').value.trim().toLowerCase();
  const usedIds = new Set(Object.values(squad));
  let list = PLAYERS.filter(squadScopeFilter()).filter(p => showAll || p.positions.includes(slot.pos));
  if (q) list = list.filter(p => p.nameHe.toLowerCase().includes(q) || (p.nameEn && p.nameEn.toLowerCase().includes(q)));
  const listEl = document.getElementById('picker-list');
  listEl.innerHTML = '';
  list.forEach(p => {
    const row = document.createElement('div');
    row.className = 'picker-row';
    const already = usedIds.has(p.id) && squad[slot.id] !== p.id;
    row.style.opacity = already ? '0.4' : '1';
    row.innerHTML = `<span>${displayName(p)}</span><span class="picker-meta">${p.positions.map(c=>POS_LABEL(c)).join('/')} · ${GROUP_LABEL(p.group)}</span>`;
    if (!already) {
      row.onclick = () => {
        // remove player from any other slot first
        Object.keys(squad).forEach(sid => { if (squad[sid]===p.id) delete squad[sid]; });
        squad[slot.id] = p.id;
        activeSlotId = null;
        renderPitch();
        document.getElementById('picker-panel').classList.add('hidden');
      };
    }
    listEl.appendChild(row);
  });
}

    showToast(t('copiedToast'));
  });
};

const ATTACK_WEIGHTS = { ST:1.0, LW:0.8, RW:0.8, AM:0.7, CM:0.4, DM:0.15, RB:0.15, LB:0.15, CB:0.05, GK:0 };
const DEFENSE_WEIGHTS = { GK:1.0, CB:1.0, LB:0.7, RB:0.7, DM:0.4, CM:0.15, AM:0.05, ST:0, LW:0, RW:0 };
// finishing chance: attacking positions score far more than others, as in real football
const SCORER_WEIGHTS = { ST:1.0, LW:0.75, RW:0.75, AM:0.6, CM:0.3, DM:0.12, RB:0.1, LB:0.1, CB:0.06, GK:0.002 };
// set-piece (corner / free kick) finishing: roughly equal for everyone, small header bonus for CB/ST
const SETPIECE_SCORER_WEIGHTS = { ST:1.0, CB:1.0, DM:0.6, CM:0.55, LB:0.5, RB:0.5, AM:0.45, LW:0.35, RW:0.35, GK:0.05 };
// creativity: wingers, fullbacks and good midfielders create chances (assists) far more than others
const CREATOR_WEIGHTS = { LW:1.0, RW:1.0, AM:0.9, CM:0.8, DM:0.5, LB:0.65, RB:0.65, CB:0.25, ST:0.2, GK:0 };

function teamRatings(team) {
  const slots = FORMATIONS[team.formationKey];
  let attackSum=0, attackW=0, defSum=0, defW=0, creationSum=0, creationW=0;
  slots.forEach(slot => {
    const pid = team.squad[slot.id];
    const p = pid ? playerById(pid) : null;
    const pot = p ? effectivePotential(p) : 4;
    const aw = ATTACK_WEIGHTS[slot.pos] || 0;
    const dw = DEFENSE_WEIGHTS[slot.pos] || 0;
    const cw = CREATOR_WEIGHTS[slot.pos] || 0;
    if (aw > 0) { attackSum += pot * aw; attackW += aw; }
    if (dw > 0) { defSum += pot * dw; defW += dw; }
    if (cw > 0) { creationSum += pot * cw; creationW += cw; }
  });
  const rawAttack = attackW ? attackSum / attackW : 4;
  const creation = creationW ? creationSum / creationW : 4;
  const defense = defW ? defSum / defW : 4;
  // good wingers/fullbacks/midfielders (creation) meaningfully boost the team's
  // real scoring threat on top of the raw finishers' quality.
  const attack = rawAttack * 0.7 + creation * 0.3;
  return { attack, defense, rawAttack, creation };
}

function poissonSample(lambda) {
  const L = Math.exp(-lambda);
  let k = 0, p = 1;
  do { k++; p *= Math.random(); } while (p > L);
  return k - 1;
}

function pickWeighted(team, weightsTable, excludeId) {
  const slots = FORMATIONS[team.formationKey];
  const candidates = slots.map(slot => {
    const pid = team.squad[slot.id];
    if (!pid || pid === excludeId) return null;
    const p = playerById(pid);
    const posWeight = weightsTable[slot.pos] || 0;
    if (!p || posWeight <= 0) return null;
    const pot = effectivePotential(p);
    // potential^1.5 so a 10-potential player (e.g. Messi) stands out clearly
    // from a 3-4 potential player in the same position, not just a linear bump.
    return { p, w: posWeight * Math.pow(pot, 1.5) };
  }).filter(Boolean);
  const total = candidates.reduce((s,c)=>s+c.w, 0);
  if (!total) return null;
  let r = Math.random() * total;
  for (const c of candidates) {
    r -= c.w;
    if (r <= 0) return c.p;
  }
  return candidates[candidates.length-1].p;
}

function generateGoalEvent(team) {
  // ~15% of goals come from corners/free kicks, where position matters less
  // and everyone has a real chance (with a small header bonus for CB/ST).
  const isSetPiece = Math.random() < 0.15;
  if (isSetPiece) {
    const scorer = pickWeighted(team, SETPIECE_SCORER_WEIGHTS, null);
    return { scorer, assist: null, setPiece: true };
  }
  const scorer = pickWeighted(team, SCORER_WEIGHTS, null);
  let assist = null;
  if (scorer && Math.random() < 0.75) {
    assist = pickWeighted(team, CREATOR_WEIGHTS, scorer.id);
  }
  return { scorer, assist, setPiece: false };
}

function simulateMatch(teamA, teamB) {
  const ratingsA = teamRatings(teamA);
  const ratingsB = teamRatings(teamB);
  const BASE = 1.3;
  const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));
  // a team's expected goals rise with its own attack and fall with the
  // opponent's defense (including the goalkeeper) — better defense/GK means
  // fewer goals conceded and more clean sheets, automatically.
  const lambdaA = clamp(BASE * (ratingsA.attack / ratingsB.defense), 0.15, 4.2);
  const lambdaB = clamp(BASE * (ratingsB.attack / ratingsA.defense), 0.15, 4.2);
  const goalsA = poissonSample(lambdaA);
  const goalsB = poissonSample(lambdaB);

  const events = [];
  for (let i=0;i<goalsA;i++) {
    events.push({ minute: 1+Math.floor(Math.random()*90), team:'A', ...generateGoalEvent(teamA) });
  }
  for (let i=0;i<goalsB;i++) {
    events.push({ minute: 1+Math.floor(Math.random()*90), team:'B', ...generateGoalEvent(teamB) });
  }
  events.sort((e1,e2) => e1.minute - e2.minute);

  const ratingsTable = computeMatchRatings(teamA, teamB, events, goalsA, goalsB);

  return { goalsA, goalsB, ratingsA, ratingsB, events, ratingsTable };
}

let globalLogIndex = 0;
const MATCH_LOG = {}; // playerId -> [{index, opponent, goals, assists, rating, passAcc, shots, tackles}], newest last

function logPlayerMatch(p, opponentName, rating, goals, assists, isAttackPos, isDefPos) {
  const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));
  const passAcc = Math.round(clamp(65 + (rating - 6) * 7 + (Math.random() * 6 - 3), 45, 99));
  const shots = isAttackPos ? Math.max(0, Math.round(Math.random() * 3 + (rating - 5) * 0.5)) : (Math.random() < 0.15 ? 1 : 0);
  const tackles = isDefPos ? Math.max(0, Math.round(Math.random() * 3 + (rating - 5) * 0.4)) : Math.max(0, Math.round(Math.random() * 1.2));
  if (!MATCH_LOG[p.id]) MATCH_LOG[p.id] = [];
  MATCH_LOG[p.id].push({ index: globalLogIndex, opponent: opponentName, goals, assists, rating, passAcc, shots, tackles });
  if (MATCH_LOG[p.id].length > 15) MATCH_LOG[p.id].shift();
}

function computeMatchRatings(teamA, teamB, events, goalsA, goalsB) {
  globalLogIndex++;
  const goalsBy = {}, assistsBy = {};
  events.forEach(e => {
    if (e.scorer) goalsBy[e.scorer.id] = (goalsBy[e.scorer.id]||0) + 1;
    if (e.assist) assistsBy[e.assist.id] = (assistsBy[e.assist.id]||0) + 1;
  });
  function ratePlayer(p, goalsFor, goalsAgainst, isDefensivePos) {
    let score = 5.5 + ((effectivePotential(p)||4) - 5) * 0.35 + (Math.random()*1.6 - 0.8);
    const g = goalsBy[p.id] || 0, a = assistsBy[p.id] || 0;
    score += g * 1.8 + a * 1.0;
    score += (goalsFor - goalsAgainst) * 0.15;
    if (isDefensivePos && goalsAgainst === 0) score += 0.6;
    return Math.max(1, Math.min(10, Math.round(score*10)/10));
  }
  function rateTeam(team, goalsFor, goalsAgainst, opponentName) {
    const slots = FORMATIONS[team.formationKey];
    return slots.map(slot => {
      const pid = team.squad[slot.id];
      const p = pid ? playerById(pid) : null;
      if (!p) return null;
      const isDef = (DEFENSE_WEIGHTS[slot.pos] || 0) >= 0.4;
      const isAtt = (ATTACK_WEIGHTS[slot.pos] || 0) >= 0.4;
      const rating = ratePlayer(p, goalsFor, goalsAgainst, isDef);
      logPlayerMatch(p, opponentName, rating, goalsBy[p.id] || 0, assistsBy[p.id] || 0, isAtt, isDef);
      return { pos: slot.pos, p, rating };
    }).filter(Boolean);
  }
  return { a: rateTeam(teamA, goalsA, goalsB, teamB.name), b: rateTeam(teamB, goalsB, goalsA, teamA.name) };
}

function renderRatingsTable(list) {

// ---------- match development: potentials evolve match after match ----------

// how much a player's potential can move after a single match, and in which
// direction: young/academy players move fastest, prime-age players slower,
// veterans slowest of all — and veterans (except Messi) drift down over time
// even on a good day. everything is rounded to a fine 0.05 resolution.
function developmentStep(p, rating, currentPotential) {
  const age = p.age || 22;
  let speed;
  if (p.careerStatus === 'academy') speed = 0.30;
  else if (age <= 23) speed = 0.20;
  else if (age <= 30) speed = 0.10;
  else speed = 0.06;

  let delta = ((rating - 6) / 4) * speed;

  if (p.id !== 'messi' && age > 31) {
    delta -= 0.05;
  }

  // the higher a player's current potential already is, the smaller any further
  // rise can be (a player near the ceiling has far less room to grow than one who
  // is still far from it). this headroom effect only softens growth, never decline.
  if (delta > 0 && currentPotential != null) {
    const headroom = Math.max(0.1, Math.min(1, (10 - currentPotential) / 9));
    delta *= headroom;
  }

  delta = Math.round(delta / 0.05) * 0.05;
  return delta;
}

function applyPostMatchDevelopment(teamA, teamB, result) {
  const changes = [];
  globalMatchIndex++;
  function processTeam(ratingsRows) {
    ratingsRows.forEach(row => {
      const p = row.p;
      const before = CURRENT_POTENTIAL[p.id] != null ? CURRENT_POTENTIAL[p.id] : basePotential(p);
      const delta = developmentStep(p, row.rating, before);
      if (delta === 0) return;
      const after = Math.max(1, Math.min(10, Math.round((before + delta) * 100) / 100));
      if (after === before) return;
      CURRENT_POTENTIAL[p.id] = after;
      if (!POTENTIAL_HISTORY[p.id]) POTENTIAL_HISTORY[p.id] = [{ match: 0, value: before }];
      POTENTIAL_HISTORY[p.id].push({ match: globalMatchIndex, value: after });
      changes.push({ p, before, after, delta: after - before });
    });
  }
  processTeam(result.ratingsTable.a);
  processTeam(result.ratingsTable.b);
  changes.sort((c1,c2) => Math.abs(c2.delta) - Math.abs(c1.delta));
  return changes;
}

// ---------- tournament mode: pre-defined fixtures, no manual team-by-team picking ----------
let tournament = null; // { format:'roundrobin'|'knockout', teamNames:[...], fixtures:[...], rounds:[[fixtureIdx,...],...] }

function roundRobinFixtures(teamNames) {
  // classic single round-robin: every team plays every other team exactly once
  const fixtures = [];
  for (let i = 0; i < teamNames.length; i++) {
    for (let j = i + 1; j < teamNames.length; j++) {
      fixtures.push({ a: teamNames[i], b: teamNames[j], played: false, goalsA: null, goalsB: null, round: 0 });
    }
  }
  return { fixtures, rounds: [fixtures.map((_, idx) => idx)] };
}

function knockoutFixtures(teamNames) {
  // pad with byes up to the next power of two; bye slots auto-advance their opponent
  let size = 1;
  while (size < teamNames.length) size *= 2;
  const slots = teamNames.slice();
  while (slots.length < size) slots.push(null); // null = bye
  const fixtures = [];
  const round0 = [];
  for (let i = 0; i < slots.length; i += 2) {
    const idx = fixtures.length;
    fixtures.push({ a: slots[i], b: slots[i + 1], played: false, goalsA: null, goalsB: null, round: 0, nextFixture: null, nextSlot: null });
    round0.push(idx);
  }
  const rounds = [round0];
  let prevRound = round0;
  let roundNum = 1;
  while (prevRound.length > 1) {
    const nextRound = [];
    for (let i = 0; i < prevRound.length; i += 2) {
      const idx = fixtures.length;
      fixtures.push({ a: null, b: null, played: false, goalsA: null, goalsB: null, round: roundNum, nextFixture: null, nextSlot: null });
      fixtures[prevRound[i]].nextFixture = idx; fixtures[prevRound[i]].nextSlot = 'a';
      fixtures[prevRound[i + 1]].nextFixture = idx; fixtures[prevRound[i + 1]].nextSlot = 'b';
      nextRound.push(idx);
    }
    rounds.push(nextRound);
    prevRound = nextRound;
    roundNum++;
  }
  // resolve byes immediately (a fixture with one real team and one null auto-advances)
  fixtures.forEach(f => {
    if (f.round === 0 && (f.a === null) !== (f.b === null)) {
      const winner = f.a === null ? f.b : f.a;
      f.played = true; f.bye = true;
      if (f.nextFixture != null) fixtures[f.nextFixture][f.nextSlot] = winner;
    }
  });
  return { fixtures, rounds };
}

function winnerOf(f) {
  if (f.bye) return f.a === null ? f.b : f.a;
  if (!f.played) return null;
  if (f.goalsA === f.goalsB) return Math.random() < 0.5 ? f.a : f.b; // sim penalty shootout, no extra state kept
  return f.goalsA > f.goalsB ? f.a : f.b;
}

function nextUnplayedFixture() {
  if (!tournament) return null;
  return tournament.fixtures.find(f => !f.played && f.a && f.b) || null;
}

function computeStandings(teamNames, fixtures) {
  const table = {};
  teamNames.forEach(n => table[n] = { name: n, played: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 });
  fixtures.forEach(f => {
    if (!f.played || f.bye || !f.a || !f.b) return;
    const ta = table[f.a], tb = table[f.b];
    ta.played++; tb.played++;
    ta.gf += f.goalsA; ta.ga += f.goalsB;
    tb.gf += f.goalsB; tb.ga += f.goalsA;
    if (f.goalsA > f.goalsB) { ta.w++; ta.pts += 3; tb.l++; }
    else if (f.goalsA < f.goalsB) { tb.w++; tb.pts += 3; ta.l++; }
    else { ta.d++; tb.d++; ta.pts++; tb.pts++; }
  });
  return Object.values(table).sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf);
}

    const chosen = Array.from(document.querySelectorAll('.tournament-team-cb'))
      .filter(cb => cb.checked).map(cb => cb.value);
    if (chosen.length < 2) { showToast(t('tournamentNeedTwoPlus'))(); return; }
    const format = document.getElementById('tournament-format').value;
    const built = format === 'knockout' ? knockoutFixtures(chosen) : roundRobinFixtures(chosen);
    tournament = { format, teamNames: chosen, fixtures: built.fixtures, rounds: built.rounds };
    renderTournamentSetup();
    renderTournamentView();
    showToast(t('tournamentCreated'))();
  };
}

function renderTournamentView() {
  const el = document.getElementById('tournament-view');
  if (!tournament) { el.innerHTML = ''; return; }
  const totalReal = tournament.fixtures.filter(f => f.a && f.b).length;
  const playedReal = tournament.fixtures.filter(f => f.played && f.a && f.b && !f.bye).length;
  const next = nextUnplayedFixture();
  let html = `<div class="event-row"><b>${t('tournamentProgress', playedReal, totalReal)}</b></div>`;
  html += `<div class="squad-actions" style="margin:8px 0;">
    <button id="btn-tournament-play" class="primary" ${next ? '' : 'disabled'}>${next ? t('btnPlayNextFixture', next.a, next.b) : t('tournamentFinished')}</button>
    <button id="btn-tournament-reset">${t('btnResetTournament')}</button>
  </div>`;
  if (tournament.format === 'roundrobin') {
    const standings = computeStandings(tournament.teamNames, tournament.fixtures);
    html += `<div class="match-team-title">${t('standingsHeader')}</div><div class="match-team-list">`;
    html += standings.map((s, i) => `<div>${i+1}. <b>${s.name}</b> — ${t('ptsAbbrev')} ${s.pts} (${s.w}${t('wAbbrev')} ${s.d}${t('dAbbrev')} ${s.l}${t('lAbbrev')}, ${s.gf}-${s.ga})</div>`).join('');
    html += '</div>';
    html += `<div class="match-team-title" style="margin-top:8px;">${t('fixturesHeader')}</div><div class="match-team-list">`;
    html += tournament.fixtures.map(f => `<div>${f.a} ${f.played ? (f.goalsA + ' : ' + f.goalsB) : t('vsLabel')} ${f.b}</div>`).join('');
    html += '</div>';
  } else {
    html += `<div class="match-team-title">${t('bracketHeader')}</div>`;
    tournament.rounds.forEach((roundIdxs, ri) => {
      html += `<div class="match-team-list"><div style="margin-top:6px;color:#7fd9ad;">${t('roundLabel', ri + 1)}</div>`;
      html += roundIdxs.map(idx => {
        const f = tournament.fixtures[idx];
        const aLabel = f.a || t('tbdLabel');
        const bLabel = f.b || t('tbdLabel');
        const score = f.bye ? t('byeLabel') : (f.played ? `${f.goalsA} : ${f.goalsB}` : t('vsLabel'));
        return `<div>${aLabel} ${score} ${bLabel}</div>`;
      }).join('');
      html += '</div>';
    });
  }
  el.innerHTML = html;
  const playBtn = document.getElementById('btn-tournament-play');
  if (playBtn && next) {
    playBtn.onclick = () => {
      const teamA = findSavedTeam(next.a);
      const teamB = findSavedTeam(next.b);
      selectedTeamAName = next.a; selectedTeamBName = next.b;
      renderMatchTeams();
      const result = simulateMatch(teamA, teamB);
      next.played = true; next.goalsA = result.goalsA; next.goalsB = result.goalsB;
      if (tournament.format === 'knockout' && next.nextFixture != null) {
        tournament.fixtures[next.nextFixture][next.nextSlot] = winnerOf(next);
      }
      applyPostMatchDevelopment(teamA, teamB, result);
      renderMatchResult(result);
      renderTournamentView();
    };
  }
  const resetBtn = document.getElementById('btn-tournament-reset');
  if (resetBtn) {
    resetBtn.onclick = () => {
      tournament = null;
      renderTournamentSetup();
      renderTournamentView();
    };
  }
}

// ---------- init ----------
applyStaticI18n();
populateLeagueFilter();
renderPlayersGrid();
renderPitch();
renderSavedTeamsList();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
