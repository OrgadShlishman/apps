<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סיכום ביקור - עוזר תיעוד</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1e33">
<link rel="apple-touch-icon" href="icon.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin:0; font-family: system-ui, -apple-system, Arial, sans-serif;
    background:#0b1e33; color:#eaf2ff; min-height:100vh;
  }
  header {
    padding:14px 16px; background:#0d2540; border-bottom:1px solid #1c3a5e;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
  }
  header h1 { font-size:17px; margin:0; }
  main { padding:14px; max-width:900px; margin:0 auto; }

  .card {
    background:#0d2540; border:1px solid #1c3a5e; border-radius:10px;
    padding:14px; margin-bottom:14px;
  }
  .card h2 { font-size:14px; color:#8fb8e6; margin:0 0 10px; }

  select, button, textarea {
    font-family: inherit; font-size:14px; border-radius:8px; border:1px solid #1c5c8f;
    background:#0e3a5f; color:#eaf2ff; padding:8px 10px;
  }
  select { min-width:140px; }
  button { cursor:pointer; }
  button.primary { background:#2ecc71; color:#03210f; font-weight:bold; border:none; }
  button.danger { background:#e74c3c; color:#fff; font-weight:bold; border:none; }
  button.ghost { background:transparent; }
  button:disabled { opacity:.5; cursor:not-allowed; }

  #rec-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #rec-indicator {
    width:12px; height:12px; border-radius:50%; background:#555; display:inline-block;
  }
  #rec-indicator.live { background:#e74c3c; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity:.2; } }

  #transcript {
    width:100%; min-height:160px; resize:vertical; white-space:pre-wrap;
    line-height:1.5;
  }
  textarea { width:100%; resize:vertical; }

  .field { margin-bottom:12px; }
  .field label { display:block; font-size:13px; color:#8fb8e6; margin-bottom:4px; }
  .field textarea { min-height:70px; }

  #actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }

  @media print {
    header, #rec-row, #genBtn, #actions, .no-print { display:none !important; }
    body { background:#fff; color:#000; }
    .card { border:1px solid #999; background:#fff; color:#000; }
    .card h2 { color:#000; }
    .field textarea { color:#000; background:#fff; border:1px solid #999; }
  }
</style>
</head>
<body>

<header>
  <h1>🩺 עוזר תיעוד ביקור</h1>
  <select id="lang">
    <option value="he-IL">עברית</option>
    <option value="en-US">English</option>
    <option value="ar-SA">العربية</option>
    <option value="ru-RU">Русский</option>
    <option value="es-ES">Español</option>
    <option value="pt-BR">Português</option>
  </select>
</header>

<main>

  <div class="card">
    <h2>הקלטה ותמלול</h2>
    <div id="rec-row">
      <span id="rec-indicator"></span>
      <button id="startBtn" class="primary">▶ התחל הקלטה</button>
      <button id="stopBtn" class="danger" disabled>■ עצור</button>
      <button id="clearBtn" class="ghost">נקה הכל</button>
    </div>
    <p style="font-size:12px;color:#8fb8e6;margin:8px 0 4px;">התמלול הוא של כל השיחה כמקטע אחד (אין הבחנה אוטומטית בין רופא לפציינט).</p>
    <textarea id="transcript" placeholder="התמלול יופיע כאן בזמן אמת..."></textarea>
  </div>

  <div class="card">
    <h2>סיכום ביקור (טיוטה אוטומטית - יש לבדוק ולתקן)</h2>
    <button id="genBtn" class="primary" style="margin-bottom:14px;">🧠 הפק סיכום מהתמלול</button>

    <div class="field">
      <label>תלונות הפציינט</label>
      <textarea id="f-complaints"></textarea>
    </div>
    <div class="field">
      <label>המלצות הרופא</label>
      <textarea id="f-recommendations"></textarea>
    </div>
    <div class="field">
      <label>תרופות שניתנו / נקבעו</label>
      <textarea id="f-medications"></textarea>
    </div>
    <div class="field">
      <label>הפניות</label>
      <textarea id="f-referrals"></textarea>
    </div>
    <div class="field">
      <label>הערות נוספות רלוונטיות</label>
      <textarea id="f-other"></textarea>
    </div>

    <div id="actions">
      <button id="printBtn">🖨️ הדפס</button>
      <button id="copyBtn">📋 העתק סיכום</button>
      <button id="downloadBtn">⬇️ הורד כקובץ טקסט</button>
    </div>
  </div>

</main>

<script>
let recognition = null;
let recognizing = false;
let finalTranscript = '';
let processedFinalCount = 0;

const transcriptEl = document.getElementById('transcript');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const clearBtn = document.getElementById('clearBtn');
const indicator = document.getElementById('rec-indicator');
const langSelect = document.getElementById('lang');

function getRecognitionCtor() {
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

// ---- lightweight speaker separation (pitch-based, 2 speakers) ----
// Assumption: whoever speaks first is the patient. A second, sufficiently
// different pitch register gets labeled as the doctor. This is a heuristic,
// not real voice-print diarization, so it works best when the two voices
// are clearly different (e.g. different gender/register).
let audioCtx = null, analyser = null, micStream = null, pitchLoopId = null;
let pitchBuffer = [];
const speakerProfiles = [
  { label: 'פציינט', pitch: null },
  { label: 'רופא', pitch: null }
];

function autoCorrelatePitch(buf, sampleRate) {
  const SIZE = buf.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.01) return -1; // too quiet / silence

  let r1 = 0, r2 = SIZE - 1;
  const thres = 0.2;
  for (let i = 0; i < SIZE / 2; i++) { if (Math.abs(buf[i]) < thres) { r1 = i; break; } }
  for (let i = 1; i < SIZE / 2; i++) { if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; } }
  const trimmed = buf.slice(r1, r2);
  const n = trimmed.length;
  const c = new Array(n).fill(0);
  for (let lag = 0; lag < n; lag++) {
    for (let i = 0; i < n - lag; i++) c[lag] += trimmed[i] * trimmed[i + lag];
  }
  let d = 0; while (d < n - 1 && c[d] > c[d + 1]) d++;
  let maxVal = -1, maxPos = -1;
  for (let i = d; i < n; i++) { if (c[i] > maxVal) { maxVal = c[i]; maxPos = i; } }
  if (maxPos <= 0) return -1;
  return sampleRate / maxPos;
}

function startPitchTracking(stream) {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  source.connect(analyser);
  const buf = new Float32Array(analyser.fftSize);

  function loop() {
    analyser.getFloatTimeDomainData(buf);
    const f = autoCorrelatePitch(buf, audioCtx.sampleRate);
    if (f > 60 && f < 500) pitchBuffer.push(f); // human voice range
    if (pitchBuffer.length > 120) pitchBuffer.shift();
    pitchLoopId = requestAnimationFrame(loop);
  }
  loop();
}

function stopPitchTracking() {
  if (pitchLoopId) cancelAnimationFrame(pitchLoopId);
  pitchLoopId = null;
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  audioCtx = null; analyser = null; micStream = null;
  pitchBuffer = [];
}

function classifySpeaker() {
  if (pitchBuffer.length === 0) return null;
  const avg = pitchBuffer.reduce((a, b) => a + b, 0) / pitchBuffer.length;
  pitchBuffer = [];

  const [p0, p1] = speakerProfiles;
  if (p0.pitch === null) { p0.pitch = avg; return p0.label; }
  if (p1.pitch === null) {
    if (Math.abs(avg - p0.pitch) > 20) { p1.pitch = avg; return p1.label; }
    p0.pitch = p0.pitch * 0.7 + avg * 0.3;
    return p0.label;
  }
  const d0 = Math.abs(avg - p0.pitch), d1 = Math.abs(avg - p1.pitch);
  if (d0 <= d1) { p0.pitch = p0.pitch * 0.7 + avg * 0.3; return p0.label; }
  p1.pitch = p1.pitch * 0.7 + avg * 0.3; return p1.label;
}

function startRecording() {
  const Ctor = getRecognitionCtor();
  if (!Ctor) {
    alert('הדפדפן הזה לא תומך בהמרת דיבור לטקסט. מומלץ Chrome או Edge.');
    return;
  }

  speakerProfiles[0].pitch = null;
  speakerProfiles[1].pitch = null;

  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    micStream = stream;
    startPitchTracking(stream);
  }).catch(() => { /* diarization unavailable, transcript still works */ });

  recognition = new Ctor();
  recognition.lang = langSelect.value;
  recognition.continuous = false;
  recognition.interimResults = true;
  processedFinalCount = 0;

  recognition.onresult = (event) => {
    let interim = '';
    for (let i = 0; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        if (i >= processedFinalCount) {
          const chunk = event.results[i][0].transcript.trim();
          if (chunk) {
            const speaker = classifySpeaker();
            finalTranscript += (speaker ? `[${speaker}] ` : '') + chunk + '\n';
          }
          processedFinalCount = i + 1;
        }
      } else {
        interim += event.results[i][0].transcript;
      }
    }
    transcriptEl.value = finalTranscript + interim;
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
  };

  recognition.onerror = (e) => {
    console.error('Speech recognition error', e.error);
  };

  recognition.onend = () => {
    if (recognizing) {
      // restart for the next utterance (continuous:false avoids the
      // duplicate-word bug seen on some mobile browsers in continuous mode)
      try { recognition.start(); processedFinalCount = 0; } catch (e) {}
    }
  };

  recognition.start();
  recognizing = true;
  indicator.classList.add('live');
  startBtn.disabled = true;
  stopBtn.disabled = false;
  langSelect.disabled = true;
}

function stopRecording() {
  recognizing = false;
  if (recognition) recognition.stop();
  stopPitchTracking();
  indicator.classList.remove('live');
  startBtn.disabled = false;
  stopBtn.disabled = true;
  langSelect.disabled = false;
}

startBtn.onclick = startRecording;
stopBtn.onclick = stopRecording;
clearBtn.onclick = () => {
  finalTranscript = '';
  transcriptEl.value = '';
  ['f-complaints','f-recommendations','f-medications','f-referrals','f-other'].forEach(id => {
    document.getElementById(id).value = '';
  });
};
transcriptEl.addEventListener('input', () => { finalTranscript = transcriptEl.value; });

// ---- heuristic extraction ----

const RULES = {
  complaints: [
    'כואב','כאב','מרגיש','מרגישה','סובל','סובלת','לא טוב','חלש','חלשה','סחרחורת',
    'קוצר נשימה','חום','שיעול','בחילה','עייף','עייפה','נפיחות',
    'hurts','pain','feel','feeling','suffering','dizziness','fever','cough','nausea','tired','ache',
    'duele','dolor','siento','fiebre','tos','duele','кашель','боль','болит','температура','усталость',
    'ألم','يؤلم','أشعر','حمى','سعال','دوخة','dor','dói','sinto','febre','tosse'
  ],
  recommendations: [
    'אני ממליץ','ממליצה','מומלץ','כדאי','תשתדל','תשתדלי','צריך לנוח','מנוחה','דיאטה','תזונה',
    'מומלץ לחזור','בדיקה נוספת','להימנע',
    'i recommend','recommendation','advise','rest','avoid','follow up','recomiendo','descanso',
    'рекомендую','советую','أوصي','ينصح','recomendo','descanso'
  ],
  medications: [
    'תרופה','תרופות','מ"ג','מיליגרם','כדור','כדורים','משחה','אנטיביוטיקה','לקחת פעמיים',
    'מרשם','נוגד','אקמול','אופטלגין','נורופן',
    'medication','prescription','tablet','mg','antibiotic','dose','pill',
    'medicamento','receta','pastilla','лекарство','рецепт','таблетка','دواء','وصفة','حبوب',
    'medicamento','receita','comprimido'
  ],
  referrals: [
    'הפניה','מפנה','מומחה','רופא עיניים','אורתופד','קרדיולוג','דימות','רנטגן','בדיקת דם','אולטרסאונד','MRI','CT',
    'referral','refer','specialist','radiology','blood test','ultrasound',
    'derivación','especialista','referencia','направление','специалист','إحالة','أخصائي','referência','especialista'
  ]
};

function splitSentences(text) {
  return text.split(/(?<=[.!?׃])\s+|\n+/).map(s => s.trim()).filter(Boolean);
}

function classify(text) {
  const sentences = splitSentences(text);
  const result = { complaints: [], recommendations: [], medications: [], referrals: [], other: [] };
  sentences.forEach(sentence => {
    const lower = sentence.toLowerCase();
    let matched = false;
    for (const cat of ['medications','referrals','recommendations','complaints']) {
      if (RULES[cat].some(kw => lower.includes(kw.toLowerCase()))) {
        result[cat].push(sentence);
        matched = true;
        break;
      }
    }
    if (!matched && sentence.length > 8) result.other.push(sentence);
  });
  return result;
}

document.getElementById('genBtn').onclick = () => {
  const text = transcriptEl.value.trim();
  if (!text) { alert('אין תמלול להפקת סיכום'); return; }
  const r = classify(text);
  document.getElementById('f-complaints').value = r.complaints.join('\n');
  document.getElementById('f-recommendations').value = r.recommendations.join('\n');
  document.getElementById('f-medications').value = r.medications.join('\n');
  document.getElementById('f-referrals').value = r.referrals.join('\n');
  document.getElementById('f-other').value = r.other.join('\n');
};

function buildSummaryText() {
  const g = id => document.getElementById(id).value.trim();
  return [
    'סיכום ביקור',
    '',
    'תלונות הפציינט:',
    g('f-complaints') || '-',
    '',
    'המלצות הרופא:',
    g('f-recommendations') || '-',
    '',
    'תרופות:',
    g('f-medications') || '-',
    '',
    'הפניות:',
    g('f-referrals') || '-',
    '',
    'הערות נוספות:',
    g('f-other') || '-'
  ].join('\n');
}

document.getElementById('printBtn').onclick = () => window.print();

document.getElementById('copyBtn').onclick = async () => {
  try {
    await navigator.clipboard.writeText(buildSummaryText());
    alert('הסיכום הועתק');
  } catch (e) {
    alert('העתקה נכשלה, אפשר לסמן ולהעתיק ידנית');
  }
};

document.getElementById('downloadBtn').onclick = () => {
  const blob = new Blob([buildSummaryText()], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'visit-summary.txt';
  a.click();
  URL.revokeObjectURL(url);
};

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
